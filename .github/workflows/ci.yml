name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: aarch64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run checks (default features)
        shell: bash
        run: bash scripts/ci.sh

      - name: Render UI screenshots (if supported)
        shell: bash
        run: bash scripts/ci.sh --screenshots

      - name: Install pinned VST3 SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk_dir="$RUNNER_TEMP/vst3sdk"
          sdk_revision="58f8da7936800732561402d7936584ca4505de07"
          git clone --quiet https://github.com/steinbergmedia/vst3sdk.git "$sdk_dir"
          git -C "$sdk_dir" fetch --quiet --depth 1 origin "$sdk_revision"
          git -C "$sdk_dir" checkout --quiet --detach "$sdk_revision"
          echo "VST3_SDK_DIR=$sdk_dir" >> "$GITHUB_ENV"

      - name: Run VST3 checks
        shell: bash
        run: bash scripts/ci.sh --vst3

      - name: Build screenshot manifest (optional)
        shell: bash
        run: |
          set -euo pipefail
          if ! compgen -G "target/ui-screenshots/*/initial-ui-*.png" >/dev/null; then
            exit 0
          fi
          python3 - <<'PY'
          import glob
          import hashlib
          import json
          import os
          from pathlib import Path
          root = Path("target/ui-screenshots")
          files = sorted(Path(p) for p in glob.glob(str(root / "*" / "initial-ui-*.png")))
          out = []
          for path in files:
            data = path.read_bytes()
            out.append({
              "path": str(path.relative_to(root)).replace(os.sep, "/"),
              "sha256": hashlib.sha256(data).hexdigest(),
              "bytes": len(data),
            })
          manifest = {"root": str(root).replace(os.sep, "/"), "files": out}
          (root / "manifest.json").write_text(json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Upload UI screenshots (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: target/ui-screenshots
          if-no-files-found: ignore

      - name: Build macOS CLAP test bundle
        shell: bash
        run: DIST_DIR="$RUNNER_TEMP/tension-field-dist" bash scripts/build-macos-test.sh

      - name: Upload macOS CLAP test bundle
        uses: actions/upload-artifact@v4
        with:
          name: tension-field-macos-clap
          path: ${{ runner.temp }}/tension-field-dist/tension_field-v0.1.0-macos.clap
          if-no-files-found: error

      - name: Build macOS VST3 test bundle
        shell: bash
        run: DIST_DIR="$RUNNER_TEMP/tension-field-dist" bash scripts/build-vst3-test.sh

      - name: Upload macOS VST3 test bundle
        uses: actions/upload-artifact@v4
        with:
          name: tension-field-macos-vst3
          path: ${{ runner.temp }}/tension-field-dist/tension_field-v0.1.0-macos.vst3
          if-no-files-found: error
